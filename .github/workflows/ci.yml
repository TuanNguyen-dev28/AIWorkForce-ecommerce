name: CI
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.22'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked pytest -m 'not integration and not security and not evaluation'
      - run: uv run --locked pytest -m security
      - run: uv run --locked pytest -m evaluation
      - run: uv run --locked python -m scripts.secret_scan
      - name: Audit all locked runtime and development dependencies
        run: |
          mkdir -p .local
          uv export --locked --no-emit-project --format requirements-txt --output-file .local/audit-requirements.txt --quiet
          uv run --locked pip-audit --strict --no-deps --disable-pip -r .local/audit-requirements.txt --cache-dir .local/pip-audit-cache
      - name: Verify generated SQL bootstrap is current
        run: |
          uv run --locked python database/mysql/scripts/build_bootstrap.py
          git diff --exit-code -- database/mysql/bootstrap.sql

  mysql:
    name: MySQL migration integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes' # pragma: allowlist secret -- disposable CI flag, no credential
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.22'
      - run: uv sync --locked
      - run: uv run --locked pytest -m integration
        env:
          TEST_MYSQL: '1'
          TEST_MYSQL_HOST: 127.0.0.1
          TEST_MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          APP_ENV: test
